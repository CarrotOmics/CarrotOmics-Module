id: 'carrotomics_content_terms'
label: 'CarrotOmics Terms'
description: 'Terms for Content Types and Chado Fields for the CarrotOmics module'
dependencies:
    module:
        - 'carrotomics'
    enforced:
        module:
            - 'carrotomics'
vocabularies:
    -   name: 'SIO'
        label: 'Semanticscience Integrated Ontology'
        url: 'https://sio.semanticscience.org/'
        idSpaces:
            -   name: 'SIO'
                description: 'Semanticscience Integrated Ontology'
                urlPrefix: 'https://semanticscience.org/resource/{db}_{accession}'
        terms:
            -   id: 'SIO:000013'
                name: 'geographic position'
                description: 'A geographic position is the coordinate of an entity against some geographic coordinate system.'
            -   id: 'SIO:000318'
                name: 'longitude'
                description: 'Longitude is a geographic position that refers to the angle east or west of a reference meridian between the two geographical poles to another meridian that passes through an arbitrary point.'
            -   id: 'SIO:000319'
                name: 'latitude'
                description: "Latitude is a geographic coordinate which refers to the angle from a point on the Earth's surface to the equatorial plane"
            -   id: 'SIO:000438'
                name: 'altitude'
                description: 'Altitude is a distance above sea level.'
    -   name: 'IAO'
        label: 'Information Artifact Ontology'
        url: 'https://github.com/information-artifact-ontology/IAO/'
        idSpaces:
            -   name: 'IAO'
                description: 'Information Artifact Ontology'
                urlPrefix: 'https://purl.obolibrary.org/obo/{db}_{accession}'
        terms:
            -   id: 'IAO:0000101'
                name: 'image'
                definition: 'An image is an affine projection to a two dimensional surface, of measurements of some quality of an entity or entities repeated at regular intervals across a spatial range, where the measurements are represented as color and luminosity on the projected on surface.'
    -   name: 'EDAM'
        label: 'Bioscientific data analysis ontology'
        url: 'https://edamontology.org/page'
        idSpaces:
            -   name: 'data'
                description: 'EDAM: Data'
                urlPrefix: 'https://edamontology.org/{db}_{accession}'
        terms:
            -   id: 'data:2091'
                name: 'Accession'
                description: 'A persistent (stable) and unique identifier, typically identifying an object (entry) from a database.'
    -   name: 'local'
        label: 'Locally created terms'
        url: 'cv/lookup/local'
        idSpaces:
            -   name: 'local'
                description: 'Locally created terms'
                urlPrefix: 'cv/lookup/{db}/{accession}'
        terms:
            -   id: 'local:analysis_project'
                name: 'analysis_project'
                description: 'Used for a Tripal Field to link all projects containing a given analysis'
            -   id: 'local:biomaterial_project'
                name: 'biomaterial_project'
                description: 'Provides a link from biomaterials to projects or to analyses that use them'
            -   id: 'local:project_analysis'
                name: 'project_analysis'
                description: 'Used for a Tripal Field to link all analyses within a given project'
            -   id: 'local:stock_analysis'
                name: 'stock_analysis'
                description: 'Used for a Tripal Field to link all stocks to analyses that use them'
            -   id: 'local:stock_project'
                name: 'stock_project'
                description: 'Used for a Tripal Field to link all stocks to projects that use them'
            -   id: 'local:project_stock'
                name: 'project_stock'
                description: 'Used for a Tripal Field to link all projects containing a given stock'
            -   id: 'local:Number_of_markers'
                name: 'Number of markers'
                description: 'Total number of markers in a linkage map.'
            -   id: 'local:Number_of_quantitative_trait_loci'
                name: 'Number of quantitative trait loci'
                description: 'Total number of quantitative trait loci in a linkage map.'
            -   id: 'local:Number_of_mendelian_trait_loci'
                name: 'Number of mendelian trait loci'
                description: 'Total number of mendelian trait loci in a linkage map.'
            -   id: 'local:Number_of_linkage_groups'
                name: 'Number of linkage groups'
                description: 'Total number of linkage groups in a linkage map.'
