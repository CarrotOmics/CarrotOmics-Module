id: 'carrotomics'
label: 'CarrotOmics Fields'
description: 'Default field configurations provided by the CarrotOmics module'
dependencies:
    module:
        - 'carrotomics'
    enforced:
        module:
            - 'carrotomics'
fields:

## Polypeptide ##

    -   name: polypeptide_name
        content_type: 'polypeptide'
