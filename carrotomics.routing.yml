##
# CarrotOmics Admin Menu.
##

# Base CarrotOmics Admin Route.
carrotomics.admin:
  path: 'admin/carrotomics'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'CarrotOmics'
  requirements:
    _permission: 'administer tripal'

# Validation tools.
carrotomics.admin.validate_form:
  path: '/admin/carrotomics/validate'
  defaults:
    _form: 'Drupal\carrotomics\Form\CarrotOmicsAdminValidate'
    _title: 'Validation Tools'
  requirements:
    _permission: 'administer tripal'

# Publication tools.
carrotomics.admin.pub_form:
  path: '/admin/carrotomics/pub'
  defaults:
    _form: 'Drupal\carrotomics\Form\CarrotOmicsAdminPub'
    _title: 'Publication Tools'
  requirements:
    _permission: 'administer tripal'

# Data export.
carrotomics.admin.export_form:
  path: '/admin/carrotomics/export'
  defaults:
    _form: 'Drupal\carrotomics\Form\CarrotOmicsAdminExport'
    _title: 'Data Export'
  requirements:
    _permission: 'administer tripal'

# SQL tools.
carrotomics.admin.sql_form:
  path: '/admin/carrotomics/sql'
  defaults:
    _form: 'Drupal\carrotomics\Form\CarrotOmicsAdminSql'
    _title: 'SQL Tools'
  requirements:
    _permission: 'administer tripal'

# Overview page.
carrotomics.status_report:
  path: '/status_report'
  defaults:
    _title: 'CarrotOmics Status Report'
    _controller: '\Drupal\carrotomics\Controller\StatusReportController::content'
  requirements:
    _access: 'TRUE'
